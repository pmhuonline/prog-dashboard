# This file must live at: .github/workflows/refresh-dashboard.yml
# The folder names matter - GitHub only looks in that exact spot.

name: Refresh dashboard data

on:
  # Run at the top of every hour.
  # The five numbers mean: minute, hour, day, month, weekday.
  # "0 * * * *"     = every hour
  # "0 6 * * *"     = once a day at 6am UTC
  # "0 6 * * 1"     = Mondays at 6am UTC
  schedule:
    - cron: "0 * * * *"

  # Also lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask Asana for the numbers
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: python fetch-asana.py

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Refresh dashboard data"
          git push
