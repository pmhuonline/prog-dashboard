<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Metrics · PMHU</title>
<link rel="icon" href="https://pmhu.b-cdn.net/wp-content/uploads/2024/11/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Light Theme Colors */
  --bg: #ffffff;
  --bg2: #f8f9fa;
  --bg3: #ffffff;
  --border: #e5e7eb;
  --border2: #d1d5db;

  /* Typography Colors */
  --muted: #6b7280;
  --soft: #4b5563;
  --body: #000000;
  --head: #000000;

  /* PMHU Coral/Pink Accent */
  --accent: #f05c5c;

  /* Tier accent */
  --tier-bg: #fff5f5; --tier-lo: #fca5a5;

  /* Status Badges */
  --live: #4ebad9;
  --dev: #636363;
  --live-bg: #f0fbff;
  --dev-bg: #f3f4f6;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.hdr{display:flex;align-items:center;gap:1.25rem;padding:0.8rem 1.75rem;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.hdr-logo{font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:500;letter-spacing:0.5px;color:var(--head);line-height:1.2;text-transform:uppercase;}
.hdr-logo span{color:var(--accent);font-family:'Inter',sans-serif;font-size:0.85rem;font-weight:600;text-transform:none;}
.hdr-div{width:1px;height:24px;background:var(--border2);}
.hdr-eye{font-size:0.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;}
.hdr-badges{display:flex;gap:.45rem;margin-left:auto;flex-wrap:nowrap;flex-shrink:0;align-items:center;}
.badge{font-size:.62rem;font-weight:600;letter-spacing:.05em;padding:.18rem .5rem;border-radius:3px;display:flex;align-items:center;gap:.28rem;white-space:nowrap;flex-shrink:0;}
.badge-live{background:var(--live-bg);color:var(--live);border:1px solid #a7e2f2;}
.badge-dev{background:var(--dev-bg);color:var(--dev);border:1px solid #d1d5db;}
.bdot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.btn-wiki{font-size:.62rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.18rem .6rem;border-radius:3px;display:flex;align-items:center;gap:.28rem;background:#fff5f5;
  color:var(--accent);border:1px solid var(--accent);text-decoration:none;white-space:nowrap;flex-shrink:0;
  transition:background 0.15s,color 0.15s;margin-left:0.5rem;}
.btn-wiki:hover{background:var(--accent);color:#ffffff;}

/* BANNER */
.banner{
  background: url('https://ssl.gstatic.com/atari/images/impression-header.png') center/cover no-repeat, #2b2e33;
  height: clamp(80px, 13vw, 150px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
  
/* PAGE */
.page{flex:1;padding:1.75rem 1.75rem 2.5rem;max-width:1180px;width:100%;margin:0 auto;}

/* BOARD SECTION */
.board{margin-bottom:2.4rem;animation:fu .18s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.board-head{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding-bottom:.6rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.board-name{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--head);}
.sp-pill{font-size:.6rem;font-weight:600;padding:.15rem .48rem;border-radius:3px;display:flex;align-items:center;gap:.28rem;}
.sp-live{background:var(--live-bg);color:var(--live);border:1px solid #a7e2f2;}
.sp-dev{background:var(--dev-bg);color:var(--dev);border:1px solid #d1d5db;}
.sp-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.55rem;}
.stat{background:var(--bg3);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:5px;padding:.85rem 1rem;text-align:left;font-family:inherit;}
.stat-label{display:block;font-size:.6rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.stat-value{font-family:'Oswald',sans-serif;font-size:2.35rem;font-weight:500;color:var(--head);line-height:1.05;display:block;}
.stat.is-empty{border-left-color:var(--border2);}
.stat.is-empty .stat-value{color:var(--border2);}

/* Clickable stat cards open a list popup */
button.stat{cursor:pointer;width:100%;display:block;transition:background .15s,border-color .15s;}
button.stat:hover{background:var(--tier-bg);border-color:var(--tier-lo);border-left-color:var(--accent);}
button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.stat-more{display:block;font-size:.62rem;font-weight:600;letter-spacing:.03em;color:var(--accent);margin-top:.4rem;}

/* BAR GROUPS */
.group{margin-top:1.4rem;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:.9rem 1.05rem 1rem;}
.group-label{font-size:.6rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;}
.bar-row{display:grid;grid-template-columns:110px 1fr 62px;gap:.75rem;align-items:center;padding:.3rem 0;}
.bar-name{font-size:.75rem;color:var(--soft);overflow-wrap:anywhere;}
.bar-track{height:9px;background:var(--dev-bg);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;width:0;border-radius:3px;transition:width 600ms ease;}
.bar-value{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:500;color:var(--head);text-align:right;}

/* TBD / NOT CONNECTED */
.tbd{background:#f9fafb;border:1px dashed #9ca3af;border-radius:6px;padding:.8rem .9rem;margin-top:.9rem;}
.tbd-l{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#4b5563;margin-bottom:.4rem;}
.tbd-b{font-size:.76rem;color:#4b5563;line-height:1.65;font-style:italic;}

/* NOTICE */
.notice{background:#f9fafb;border:1px dashed #9ca3af;border-radius:6px;padding:1rem 1.1rem;font-size:.78rem;color:var(--soft);line-height:1.7;max-width:44rem;}
.notice code{font-family:ui-monospace,monospace;font-size:.85em;background:var(--dev-bg);border:1px solid var(--border);padding:.08em .35em;border-radius:3px;}

/* POPUP */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:1.25rem;z-index:200;animation:fade .15s ease;}
.backdrop[hidden]{display:none;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.22);animation:fu .18s ease;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1rem 1.15rem .85rem;border-bottom:1px solid var(--border);background:var(--bg2);}
.modal-title{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--head);}
.modal-count{font-size:.62rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-top:.25rem;}
.modal-close{background:none;border:1px solid var(--border2);border-radius:4px;padding:.22rem .55rem;font-family:'Inter',sans-serif;font-size:.67rem;font-weight:500;color:var(--muted);cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s,background .15s;}
.modal-close:hover{color:#ffffff;background:var(--accent);border-color:var(--accent);}
.modal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.modal-body{padding:1rem 1.15rem 1.2rem;overflow-y:auto;}
.modal-list{list-style:none;display:flex;flex-direction:column;gap:.3rem;}
.modal-list li{font-size:.8rem;line-height:1.6;color:var(--body);padding-left:1rem;position:relative;}
.modal-list li::before{content:"—";position:absolute;left:0;color:var(--accent);font-size:.68rem;font-weight:bold;}

/* FOOTER */
.dfn{padding:.65rem 1.75rem;border-top:1px solid var(--border);background:var(--bg2);font-size:.67rem;color:var(--muted);flex-shrink:0;line-height:1.5;}

/* MOBILE */
@media(max-width:720px){
  .hdr{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 15px;}
  .hdr-div{display:none;}
  .hdr-badges{margin-left:0;flex-wrap:wrap;}
  .page{padding:1.25rem 15px 2rem;}
  .stats{grid-template-columns:1fr 1fr;}
  .stat-value{font-size:1.9rem;}
  .bar-row{grid-template-columns:88px 1fr 48px;gap:.5rem;}
  .dfn{padding:.65rem 15px;}
}

@media(prefers-reduced-motion:reduce){
  .bar-fill{transition:none;}
  .board,.modal,.backdrop{animation:none;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo" id="brand">Program Metrics <span>/ PMHU</span></div>
  <div class="hdr-div"></div>
  <div class="hdr-eye" id="updated">Loading…</div>
  <div class="hdr-badges">
    <div class="badge badge-live"><span class="bdot"></span>Connected</div>
    <div class="badge badge-dev"><span class="bdot"></span>In development</div>
    <!-- Point this at whichever wiki page this dashboard belongs under -->
    <a href="https://sites.google.com/pmhu.org/pmhu-wiki/" target="_blank" class="btn-wiki">Back to Wiki ↗&#xFE0E;</a>
  </div>
</header>

<div class="banner" aria-hidden="true"></div>
  
<main class="page" id="boards"></main>

<div class="dfn">Source: live Asana project data · Refreshed hourly by an automated job · Figures reflect tasks present in each board at the time of the last refresh.</div>

<!-- List popup, filled in when a clickable stat card is pressed -->
<div class="backdrop" id="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-count" id="modal-count"></div>
      </div>
      <button class="modal-close" id="modal-close" type="button">close ×</button>
    </div>
    <div class="modal-body">
      <ul class="modal-list" id="modal-list"></ul>
    </div>
  </div>
</div>

<script>
// Bars cycle through the PMHU palette, one colour per chart, unless
// the config names a colour for a specific value.
var BAR_COLORS = ["var(--accent)", "var(--live)", "var(--dev)"];
var PALETTE = {
  accent: "var(--accent)",
  live:   "var(--live)",
  dev:    "var(--dev)",
  muted:  "var(--muted)",
  soft:   "var(--soft)"
};

var backdrop = document.getElementById("backdrop");
var lastFocused = null;

function formatNumber(value) {
  return Number(value).toLocaleString("en-US");
}

function formatDate(isoString) {
  var when = new Date(isoString);
  if (isNaN(when)) return "";
  return "Live Data Report · Updated " + when.toLocaleString("en-US", {
    day: "numeric", month: "short", year: "numeric",
    hour: "numeric", minute: "2-digit"
  });
}

function openList(figure) {
  lastFocused = document.activeElement;
  document.getElementById("modal-title").textContent = figure.label;
  document.getElementById("modal-count").textContent =
    figure.items.length + (figure.items.length === 1 ? " entry" : " entries");

  var list = document.getElementById("modal-list");
  list.innerHTML = "";
  figure.items.forEach(function (entry) {
    var li = document.createElement("li");
    li.textContent = entry;
    list.appendChild(li);
  });

  backdrop.hidden = false;
  document.getElementById("modal-close").focus();
}

function closeList() {
  backdrop.hidden = true;
  if (lastFocused) lastFocused.focus();
}

document.getElementById("modal-close").addEventListener("click", closeList);
backdrop.addEventListener("click", function (event) {
  if (event.target === backdrop) closeList();
});
document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && !backdrop.hidden) closeList();
});

function makeStats(figures) {
  var grid = document.createElement("div");
  grid.className = "stats";

  figures.forEach(function (figure) {
    var hasList = Array.isArray(figure.items) && figure.items.length > 0;
    var card = document.createElement(hasList ? "button" : "div");
    card.className = "stat";

    if (hasList) {
      card.type = "button";
      card.addEventListener("click", function () { openList(figure); });
    }

    var label = document.createElement("span");
    label.className = "stat-label";
    label.textContent = figure.label;

    var value = document.createElement("strong");
    value.className = "stat-value";

    if (figure.value === null || figure.value === undefined) {
      card.classList.add("is-empty");
      value.textContent = "\u2014";  // em dash
    } else {
      value.textContent = formatNumber(figure.value);
    }

    card.appendChild(label);
    card.appendChild(value);

    if (hasList) {
      var more = document.createElement("span");
      more.className = "stat-more";
      more.textContent = "View list →";
      card.appendChild(more);
    }

    grid.appendChild(card);
  });

  return grid;
}

function makeBarGroup(group, colorIndex, delayCounter) {
  var box = document.createElement("div");
  box.className = "group";

  var heading = document.createElement("div");
  heading.className = "group-label";
  heading.textContent = group.label;
  box.appendChild(heading);

  var counts = group.items.map(function (item) { return item.value; });
  var largest = Math.max.apply(null, counts.concat([1]));

  group.items.forEach(function (item) {
    var row = document.createElement("div");
    row.className = "bar-row";

    var name = document.createElement("div");
    name.className = "bar-name";
    name.textContent = item.name;

    var track = document.createElement("div");
    track.className = "bar-track";

    var fill = document.createElement("div");
    fill.className = "bar-fill";
    fill.style.background = item.color
      ? (PALETTE[item.color] || item.color)
      : BAR_COLORS[colorIndex % BAR_COLORS.length];
    track.appendChild(fill);

    var value = document.createElement("div");
    value.className = "bar-value";
    value.textContent = formatNumber(item.value);

    row.appendChild(name);
    row.appendChild(track);
    row.appendChild(value);
    box.appendChild(row);

    var width = (item.value / largest) * 100;
    var delay = 120 + (delayCounter.count * 60);
    delayCounter.count += 1;
    setTimeout(function () { fill.style.width = width + "%"; }, delay);
  });

  return box;
}

function drawBoards(sections) {
  var host = document.getElementById("boards");
  host.innerHTML = "";
  var delayCounter = { count: 0 };

  sections.forEach(function (section, index) {
    var board = document.createElement("section");
    board.className = "board";

    var head = document.createElement("div");
    head.className = "board-head";

    var name = document.createElement("h2");
    name.className = "board-name";
    name.textContent = section.name;
    head.appendChild(name);

    var pill = document.createElement("span");
    var dot = document.createElement("span");
    dot.className = "sp-dot";
    pill.appendChild(dot);

    if (section.note) {
      pill.className = "sp-pill sp-dev";
      pill.appendChild(document.createTextNode(section.note));
    } else {
      pill.className = "sp-pill sp-live";
      pill.appendChild(document.createTextNode("Connected"));
    }
    head.appendChild(pill);
    board.appendChild(head);

    board.appendChild(makeStats(section.figures || []));

    (section.breakdowns || []).forEach(function (group) {
      board.appendChild(makeBarGroup(group, index, delayCounter));
    });

    if (section.note) {
      var tbd = document.createElement("div");
      tbd.className = "tbd";
      var tbdLabel = document.createElement("div");
      tbdLabel.className = "tbd-l";
      tbdLabel.textContent = "✦ Awaiting data";
      var tbdBody = document.createElement("div");
      tbdBody.className = "tbd-b";
      tbdBody.textContent =
        "This board isn't reporting into the dashboard yet. Figures will " +
        "appear here once the Asana project is built and connected.";
      tbd.appendChild(tbdLabel);
      tbd.appendChild(tbdBody);
      board.appendChild(tbd);
    }

    host.appendChild(board);
  });
}

// The ?t= on the end stops browsers serving a stale copy.
fetch("data.json?t=" + Date.now())
  .then(function (response) {
    if (!response.ok) throw new Error("missing");
    return response.json();
  })
  .then(function (data) {
    var title = data.title || "Program Metrics";
    document.getElementById("brand").innerHTML =
      title.replace(/[<>&]/g, "") + ' <span>/ PMHU</span>';
    document.title = title + " · PMHU";
    document.getElementById("updated").textContent = formatDate(data.updated);
    drawBoards(data.sections || []);
  })
  .catch(function () {
    document.getElementById("updated").textContent = "No data loaded";
    document.getElementById("boards").innerHTML =
      '<div class="notice">No figures yet. Run the ' +
      "<code>Refresh dashboard data</code> action from the Actions tab of " +
      "this repository, then reload this page.</div>";
  });
</script>
</body>
</html>
